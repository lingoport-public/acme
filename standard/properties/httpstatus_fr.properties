# Informational responses
HTTP_100=Continuer. Le serveur a reçu les en-têtes de la requête.
HTTP_101=Changement de protocole. Le serveur change de protocole.

# Successful responses
HTTP_200=OK. La demande a abouti.
HTTP_201=Créé. La ressource a été créée avec succès à l’emplacement {0}.
HTTP_202=Acceptée. La demande a été acceptée pour traitement, mais celui-ci n’est pas terminé.

# Client error responses
HTTP_400=Requête incorrecte. Le serveur n’a pas pu comprendre la requête en raison d’une syntaxe non valide.
HTTP_401=Non autorisé. L’authentification est requise et a échoué ou n’a pas encore été fournie.
HTTP_403=Accès interdit. Vous n’avez pas l’autorisation d’accéder à cette ressource.
HTTP_404=Introuvable. La ressource demandée est introuvable.
HTTP_429=Trop de requêtes. Vous avez envoyé trop de requêtes en un temps donné.

# Server error responses
HTTP_500=Erreur interne du serveur. Le serveur a rencontré une condition inattendue.
HTTP_502=Passerelle incorrecte. Le serveur a reçu une réponse non valide du serveur en amont.
HTTP_503=Service indisponible. Le serveur est actuellement incapable de traiter la demande en raison d’une surcharge temporaire ou d’une maintenance.

# Plural strings
#HTTP_429_RETRY_AFTER={nbSec, plural, one { You have exceeded the rate limit. Please wait {nbsec} second before retrying} other { You have exceeded the rate limit. Please wait {nbSec} seconds before retrying}}
#HTTP_503_RETRY_IN={nbMinutes, plural, one { Please try again in {nbMinutes} minute} other { Please try again in {nbMinutes} minutes}}

# Note on Plural strings: Keep a 'full segment' inside a selector's string to avoid concatenation issues
# for example, avoid the following as it may be difficult to translate correctly in languages with another word order (Japanese, etc.)
# HTTP_429_RETRY_AFTER=You have exceeded the rate limit. Please wait {nbSec, plural, one {  {nbsec} second } other {  {nbSec} seconds }} before retrying
