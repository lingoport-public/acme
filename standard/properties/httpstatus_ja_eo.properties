# Informational responses
HTTP_100=[続行。サーバーはリクエストヘッダーを受信しました。------------- П國カ내]
HTTP_101=[プロトコルの切り替え。サーバーはプロトコルを切り替えています。----------- П國カ내]

# Successful responses
HTTP_200=[大丈夫。リクエストは成功しました。---------- П國カ내]
HTTP_201=[作成されました。リソースは {0} で正常に作成されました。----------------- П國カ내]
HTTP_202=[承諾しました。リクエストの処理は受け付けられましたが、処理はまだ完了していません。----------------- П國カ내]

# Client error responses
HTTP_400=[リクエストが不正です。構文が無効なため、サーバーはリクエストを理解できませんでした。------------------ П國カ내]
HTTP_401=[無許可。認証が必要ですが、失敗したか、まだ提供されていません。----------- П國カ내]
HTTP_403=[禁じられた。このリソースにアクセスする権限がありません。--------------- П國カ내]
HTTP_404=[見つかりません。要求されたリソースが見つかりませんでした。---------------- П國カ내]
HTTP_429=[リクエストが多すぎます。一定時間内に送信したリクエストが多すぎます。------------- П國カ내]

# Server error responses
HTTP_500=[内部サーバーエラー。サーバーで予期しない状態が発生しました。----------------- П國カ내]
HTTP_502=[不正なゲートウェイ。サーバーはアップストリームサーバーから無効な応答を受け取りました。------------------ П國カ내]
HTTP_503=[サービスは利用できません。一時的な過負荷またはメンテナンスのため、サーバーは現在リクエストを処理できません。-------------- П國カ내]

# Plural strings
HTTP_429_RETRY_AFTER={nbSec, plural, one {[ レート制限を超えました。{nbsec} 秒待ってから再試行してください。--------------- П國カ내]} other {[ レート制限を超えました。{nbSec} 秒待ってから再試行してください-------------- П國カ내]}}
HTTP_503_RETRY_IN={nbMinutes, plural, one {[ {nbMinutes} 分後にもう一度試してください-------------- П國カ내]} other {[ {nbMinutes} 分後にもう一度試してください-------------- П國カ내]}}

# Note on Plural strings: Keep a 'full segment' inside a selector's string to avoid concatenation issues
# for example, avoid the following as it may be difficult to translate correctly in languages with another word order (Japanese, etc.)
# HTTP_429_RETRY_AFTER=You have exceeded the rate limit. Please wait {nbSec, plural, one {  {nbsec} second } other {  {nbSec} seconds }} before retrying
