# HTTP error status codes (4xx client errors, 5xx server errors)
# Key pattern:
#   http.error.<code>.title       - short reason phrase
#   http.error.<code>.description - user-facing explanation
# Note: values avoid apostrophes so they are safe with java.text.MessageFormat.

# ---------------------------------------------------------------
# 4xx Client Errors
# ---------------------------------------------------------------
http.error.400.title=Bad Request
http.error.400.description=The server could not understand the request because of invalid syntax.

http.error.401.title=Unauthorized
http.error.401.description=Authentication is required to access this resource.

http.error.402.title=Payment Required
http.error.402.description=Payment is required before this request can be processed.

http.error.403.title=Forbidden
http.error.403.description=You do not have permission to access this resource.

http.error.404.title=Not Found
http.error.404.description=The requested resource could not be found.

http.error.405.title=Method Not Allowed
http.error.405.description=The request method is not supported for this resource.

http.error.406.title=Not Acceptable
http.error.406.description=The server cannot produce a response matching the accepted formats.

http.error.407.title=Proxy Authentication Required
http.error.407.description=You must authenticate with the proxy before this request can be completed.

http.error.408.title=Request Timeout
http.error.408.description=The server timed out waiting for the request.

http.error.409.title=Conflict
http.error.409.description=The request conflicts with the current state of the resource.

http.error.410.title=Gone
http.error.410.description=The requested resource is no longer available and will not return.

http.error.411.title=Length Required
http.error.411.description=The request must include a valid Content-Length header.

http.error.412.title=Precondition Failed
http.error.412.description=One or more conditions in the request headers were not met.

http.error.413.title=Content Too Large
http.error.413.description=The request body is larger than the server is willing to process.

http.error.414.title=URI Too Long
http.error.414.description=The requested URI is longer than the server is willing to interpret.

http.error.415.title=Unsupported Media Type
http.error.415.description=The format of the request body is not supported.

http.error.416.title=Range Not Satisfiable
http.error.416.description=The requested range cannot be served for this resource.

http.error.417.title=Expectation Failed
http.error.417.description=The server cannot meet the requirements of the Expect request header.

http.error.418.title=I Am a Teapot
http.error.418.description=The server refuses to brew coffee because it is a teapot.

http.error.421.title=Misdirected Request
http.error.421.description=The request was sent to a server that cannot produce a response.

http.error.422.title=Unprocessable Content
http.error.422.description=The request was well formed but contains semantic errors.

http.error.423.title=Locked
http.error.423.description=The resource you are trying to access is locked.

http.error.424.title=Failed Dependency
http.error.424.description=The request failed because a previous request it depends on failed.

http.error.425.title=Too Early
http.error.425.description=The server is unwilling to process a request that might be replayed.

http.error.426.title=Upgrade Required
http.error.426.description=The client must switch to a different protocol to continue.

http.error.428.title=Precondition Required
http.error.428.description=The server requires this request to be conditional.

http.error.429.title=Too Many Requests
http.error.429.description=You have sent too many requests in a given amount of time. Please try again later.

http.error.431.title=Request Header Fields Too Large
http.error.431.description=The request headers are too large for the server to process.

http.error.451.title=Unavailable For Legal Reasons
http.error.451.description=This resource is unavailable for legal reasons.

# ---------------------------------------------------------------
# 5xx Server Errors
# ---------------------------------------------------------------
http.error.500.title=Internal Server Error
http.error.500.description=The server encountered an unexpected condition and could not complete the request.

http.error.501.title=Not Implemented
http.error.501.description=The server does not support the functionality required to fulfill the request.

http.error.502.title=Bad Gateway
http.error.502.description=The server received an invalid response from an upstream server.

http.error.503.title=Service Unavailable
http.error.503.description=The server is temporarily unable to handle the request. Please try again later.

http.error.504.title=Gateway Timeout
http.error.504.description=The upstream server did not respond in time.

http.error.505.title=HTTP Version Not Supported
http.error.505.description=The HTTP version used in the request is not supported by the server.

http.error.506.title=Variant Also Negotiates
http.error.506.description=The server has an internal configuration error in content negotiation.

http.error.507.title=Insufficient Storage
http.error.507.description=The server is unable to store the data needed to complete the request.

http.error.508.title=Loop Detected
http.error.508.description=The server detected an infinite loop while processing the request.

http.error.510.title=Not Extended
http.error.510.description=Further extensions to the request are required for the server to fulfill it.

http.error.511.title=Network Authentication Required
http.error.511.description=You must authenticate to gain network access.

# ---------------------------------------------------------------
# Generic fallbacks
# ---------------------------------------------------------------
http.error.unknown.title=Unexpected Error
http.error.unknown.description=An unexpected error occurred (status {0}). Please try again.
