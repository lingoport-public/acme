# HTTP error status codes (4xx client errors, 5xx server errors)
# Key pattern:
#   http.error.<code>.title       - short reason phrase
#   http.error.<code>.description - user-facing explanation
# Note: values avoid apostrophes so they are safe with java.text.MessageFormat.

# ---------------------------------------------------------------
# 4xx Client Errors
# ---------------------------------------------------------------
http.error.400.title=Requête invalide
http.error.400.description=Requête invalide : syntaxe incorrecte.

http.error.401.title=Non autorisé
http.error.401.description=Connexion requise pour accéder à cette ressource.

http.error.402.title=Paiement requis
http.error.402.description=Paiement requis pour traiter cette demande.

http.error.403.title=Interdit
http.error.403.description=Vous n'êtes pas autorisé à accéder à cette ressource.

http.error.404.title=Introuvable
http.error.404.description=Ressource demandée introuvable.

http.error.405.title=Méthode non autorisée
http.error.405.description=Méthode de requête non prise en charge pour cette ressource.

http.error.406.title=Inacceptable
http.error.406.description=Le serveur ne peut renvoyer de réponse dans un format accepté.

http.error.407.title=Authentification du proxy requise
http.error.407.description=Authentifiez-vous auprès du proxy pour effectuer cette requête.

http.error.408.title=Délai d'attente dépassé
http.error.408.description=Délai d'attente du serveur dépassé.

http.error.409.title=Conflit
http.error.409.description=La requête est en conflit avec l'état actuel de la ressource.

http.error.410.title=Épuisé
http.error.410.description=La ressource demandée n'est plus disponible et ne reviendra pas.

http.error.411.title=Longueur requise
http.error.411.description=Incluez un en-tête Content-Length valide.

http.error.412.title=Précondition échouée
http.error.412.description=Une ou plusieurs conditions des en-têtes de la requête ne sont pas remplies.

http.error.413.title=Contenu trop volumineux
http.error.413.description=Le corps de la requête est trop volumineux pour le serveur.

http.error.414.title=URI trop long
http.error.414.description=L’URL demandée est trop longue pour être interprétée par le serveur.

http.error.415.title=Type de fichier non pris en charge
http.error.415.description=Format du corps de la requête non pris en charge.

http.error.416.title=Plage invalide
http.error.416.description=Impossible de fournir la plage demandée pour cette ressource.

http.error.417.title=Attente non satisfaite
http.error.417.description=Le serveur ne peut satisfaire l'en-tête de requête 'Expect'.

http.error.418.title=Je suis une théière
http.error.418.description=Le serveur refuse de préparer du café : c'est une théière.

http.error.421.title=Requête mal dirigée
http.error.421.description=La requête a été envoyée à un serveur incapable de répondre.

http.error.422.title=Contenu non traitable
http.error.422.description=Requête bien formée, mais contenant des erreurs sémantiques.

http.error.423.title=Verrouillé
http.error.423.description=La ressource à laquelle vous essayez d'accéder est verrouillée.

http.error.424.title=Dépendance non satisfaite
http.error.424.description=La requête a échoué : la requête dont elle dépend a déjà échoué.

http.error.425.title=Trop tôt
http.error.425.description=Le serveur refuse de traiter une requête pouvant être rejouée.

http.error.426.title=Mise à niveau requise
http.error.426.description=Changez de protocole pour continuer.

http.error.428.title=Condition préalable requise
http.error.428.description=Le serveur exige une requête conditionnelle.

http.error.429.title=Trop de requêtes
http.error.429.description=Trop de requêtes envoyées en peu de temps. Réessayez plus tard.

http.error.431.title=En-têtes de requête trop volumineux
http.error.431.description=Les en-têtes de requête sont trop volumineux pour le serveur.

http.error.451.title=Indisponible pour des raisons légales
http.error.451.description=Cette ressource est indisponible pour des raisons légales.

# ---------------------------------------------------------------
# 5xx Server Errors
# ---------------------------------------------------------------
http.error.500.title=Erreur interne du serveur
http.error.500.description=Erreur serveur inattendue — la requête n’a pas pu être traitée.

http.error.501.title=Non implémenté
http.error.501.description=Fonctionnalité requise non prise en charge par le serveur.

http.error.502.title=Erreur de passerelle
http.error.502.description=Le serveur a reçu une réponse invalide d'un serveur en amont.

http.error.503.title=Service indisponible
http.error.503.description=Serveur temporairement indisponible. Réessayez plus tard.

http.error.504.title=Délai d'attente de la passerelle
http.error.504.description=Le serveur en amont n'a pas répondu à temps.

http.error.505.title=Version HTTP non prise en charge
http.error.505.description=Version HTTP non prise en charge par le serveur.

http.error.506.title=Variante négociable
http.error.506.description=Erreur de configuration interne du serveur lors de la négociation de contenu.

http.error.507.title=Espace de stockage insuffisant
http.error.507.description=Impossible d'enregistrer les données nécessaires pour traiter la demande.

http.error.508.title=Boucle détectée
http.error.508.description=Le serveur a détecté une boucle infinie lors du traitement de la requête.

http.error.510.title=Non prolongé
http.error.510.description=Ajoutez des extensions à la requête pour que le serveur la traite.

http.error.511.title=Authentification réseau requise
http.error.511.description=Authentifiez-vous pour accéder au réseau.

# ---------------------------------------------------------------
# Generic fallbacks
# ---------------------------------------------------------------
http.error.unknown.title=Erreur inattendue
http.error.unknown.description=Erreur inattendue (code {0}). Réessayez.
