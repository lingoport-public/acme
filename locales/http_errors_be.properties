# HTTP error status codes (4xx client errors, 5xx server errors)
# Key pattern:
#   http.error.<code>.title       - short reason phrase
#   http.error.<code>.description - user-facing explanation
# Note: values avoid apostrophes so they are safe with java.text.MessageFormat.

# ---------------------------------------------------------------
# 4xx Client Errors
# ---------------------------------------------------------------
http.error.400.title=Некарэктны запыт
http.error.400.description=Сервер не зразумеў запыт з-за няправільнага сінтаксісу.

http.error.401.title=Неаўтарызаваны
http.error.401.description=Увайдзіце, каб атрымаць доступ да гэтага рэсурсу.

http.error.402.title=Патрабуецца аплата
http.error.402.description=Перад апрацоўкай гэтага запыту патрабуецца аплата.

http.error.403.title=Забаронена
http.error.403.description=У вас няма дазволу на доступ да гэтага рэсурсу.

http.error.404.title=Не знойдзена
http.error.404.description=Запытаны рэсурс не знойдзены.

http.error.405.title=Метад не дазволены
http.error.405.description=Гэты метад запыту не падтрымліваецца.

http.error.406.title=Непрымальна
http.error.406.description=Сервер не можа стварыць адказ у падтрымліваемых фарматах.

http.error.407.title=Патрабуецца аўтэнтыфікацыя праз праксі-сервер
http.error.407.description=Аўтэнтыфікуйцеся праз праксі, каб працягнуць.

http.error.408.title=Час чакання запыту скончыўся
http.error.408.description=Час чакання адказу сервера скончыўся.

http.error.409.title=Канфлікт
http.error.409.description=Запыт супярэчыць бягучаму стану рэсурсу.

http.error.410.title=Няма
http.error.410.description=Запытаны рэсурс больш не даступны і не будзе адноўлены.

http.error.411.title=Патрабуецца даўжыня
http.error.411.description=Запыт павінен мець правільны загаловак Content-Length.

http.error.412.title=Умова не выканана
http.error.412.description=Не выканана адна або некалькі ўмоваў у загалоўках запыту.

http.error.413.title=Змест занадта вялікі
http.error.413.description=Цела запыту занадта вялікае; сервер не можа яго апрацаваць.

http.error.414.title=URI занадта доўгі
http.error.414.description=Запытаны URI занадта доўгі для апрацоўкі серверам.

http.error.415.title=Тып файла не падтрымліваецца
http.error.415.description=Непадтрымоўваны фармат цела запыту.

http.error.416.title=Няправільны дыяпазон
http.error.416.description=Гэты рэсурс не падтрымлівае запытаны дыяпазон.

http.error.417.title=Чаканне не апраўдалася
http.error.417.description=Сервер не можа задаволіць патрабаванні загалоўка запыту «Expect».

http.error.418.title=Я — чайнік
http.error.418.description=Сервер адмаўляецца заварыць каву — ён чайнік.

http.error.421.title=Няправільна накіраваны запыт
http.error.421.description=Запыт адпраўлены на сервер, які не можа адказаць.

http.error.422.title=Немагчыма апрацаваць змест
http.error.422.description=Запыт сфармаваны правільна, але змяшчае няправільныя дадзеныя.

http.error.423.title=Заблакаваны
http.error.423.description=Доступ да рэсурсу заблакаваны.

http.error.424.title=Памылка залежнасці
http.error.424.description=Не ўдалося выканаць запыт — папярэдні, ад якога ён залежыць, не выкананы.

http.error.425.title=Занадта рана
http.error.425.description=Сервер адмаўляецца апрацоўваць запыт, які можа быць паўтораны.

http.error.426.title=Патрабуецца абнаўленне
http.error.426.description=Каб працягнуць, перайдзіце на іншы пратакол.

http.error.428.title=Патрабуецца папярэдняя ўмова
http.error.428.description=Сервер патрабуе, каб гэты запыт быў умоўным.

http.error.429.title=Занадта шмат запытаў
http.error.429.description=Занадта шмат запытаў за кароткі час. Паспрабуйце пазней.

http.error.431.title=Палі загалоўкаў запыту занадта вялікія
http.error.431.description=Загалоўкі запыту занадта вялікія для сервера.

http.error.451.title=Нядаступна па прававых прычынах
http.error.451.description=Гэты рэсурс недаступны па прававых прычынах.

# ---------------------------------------------------------------
# 5xx Server Errors
# ---------------------------------------------------------------
http.error.500.title=Унутраная памылка сервера
http.error.500.description=Сервер сутыкнуўся з нечаканай памылкай і не змог выканаць запыт.

http.error.501.title=Не рэалізавана
http.error.501.description=Сервер не падтрымлівае неабходную функцыянальнасць для выканання запыту.

http.error.502.title=Памылка шлюза
http.error.502.description=Сервер атрымаў некарэктны адказ ад вышэйшага сервера.

http.error.503.title=Сэрвіс недаступны
http.error.503.description=Сервер часова недаступны. Паспрабуйце пазней.

http.error.504.title=Час чакання шлюза скончыўся
http.error.504.description=Аддалены сервер не адказаў своечасова.

http.error.505.title=HTTP-версія не падтрымліваецца
http.error.505.description=Версія HTTP у запыце не падтрымліваецца серверам.

http.error.506.title=Варыянт даступны для перамоў
http.error.506.description=На серверы ўзнікла ўнутраная памылка канфігурацыі пры ўзгадненні зместу.

http.error.507.title=Недастаткова памяці
http.error.507.description=Сервер не можа захаваць неабходныя для запыту дадзеныя.

http.error.508.title=Выяўлены цыкл
http.error.508.description=Сервер выявіў бясконцовы цыкл падчас апрацоўкі запыту.

http.error.510.title=Не пашырана
http.error.510.description=Сервер патрабуе дадатковых пашырэнняў запыту.

http.error.511.title=Увайдзіце ў сетку
http.error.511.description=Увайдзіце, каб атрымаць доступ да сеткі.

# ---------------------------------------------------------------
# Generic fallbacks
# ---------------------------------------------------------------
http.error.unknown.title=Нечаканая памылка
http.error.unknown.description=Адбылася нечаканая памылка (код {0}). Паспрабуйце яшчэ раз.
