# HTTP error status codes (4xx client errors, 5xx server errors)
# Key pattern:
#   http.error.<code>.title       - short reason phrase
#   http.error.<code>.description - user-facing explanation
# Note: values avoid apostrophes so they are safe with java.text.MessageFormat.

# ---------------------------------------------------------------
# 4xx Client Errors
# ---------------------------------------------------------------
http.error.400.title=Richiesta non valida
http.error.400.description=Impossibile elaborare la richiesta: sintassi non valida.

http.error.401.title=Non autorizzato
http.error.401.description=Accesso richiesto per visualizzare questa risorsa.

http.error.402.title=Pagamento richiesto
http.error.402.description=Effettua il pagamento per procedere con la richiesta.

http.error.403.title=Vietato
http.error.403.description=Non sei autorizzato ad accedere a questa risorsa.

http.error.404.title=Non trovato
http.error.404.description=Risorsa non trovata.

http.error.405.title=Metodo non consentito
http.error.405.description=Metodo di richiesta non supportato per questa risorsa.

http.error.406.title=Non accettabile
http.error.406.description=Il server non può fornire una risposta nei formati accettati.

http.error.407.title=Autenticazione proxy richiesta
http.error.407.description=Autenticati con il proxy per completare la richiesta.

http.error.408.title=Richiesta scaduta
http.error.408.description=Il server non ha risposto in tempo.

http.error.409.title=Conflitto
http.error.409.description=La richiesta è in conflitto con lo stato attuale della risorsa.

http.error.410.title=Esaurito
http.error.410.description=La risorsa richiesta non è più disponibile e non tornerà.

http.error.411.title=Lunghezza obbligatoria
http.error.411.description=La richiesta deve includere un'intestazione Content-Length valida.

http.error.412.title=Precondizione non soddisfatta
http.error.412.description=Una o più condizioni nelle intestazioni della richiesta non sono state soddisfatte.

http.error.413.title=Contenuto troppo grande
http.error.413.description=La dimensione del corpo della richiesta supera il limite consentito dal server.

http.error.414.title=URL troppo lungo
http.error.414.description=L'URL richiesto è troppo lungo per il server.

http.error.415.title=Tipo di file non supportato
http.error.415.description=Formato del corpo della richiesta non supportato.

http.error.416.title=Intervallo non valido
http.error.416.description=Intervallo richiesto non disponibile per questa risorsa.

http.error.417.title=Richiesta non soddisfatta
http.error.417.description=Il server non può soddisfare i requisiti dell'intestazione "Expect".

http.error.418.title=Sono una teiera
http.error.418.description=Il server rifiuta di preparare il caffè: è una teiera.

http.error.421.title=Richiesta indirizzata male
http.error.421.description=Richiesta inviata a un server che non può rispondere.

http.error.422.title=Contenuto non elaborabile
http.error.422.description=Richiesta ben formata, ma contiene errori semantici.

http.error.423.title=Bloccato
http.error.423.description=La risorsa a cui stai cercando di accedere è bloccata.

http.error.424.title=Dipendenza non soddisfatta
http.error.424.description=Richiesta fallita: dipende da una richiesta precedente non riuscita.

http.error.425.title=Troppo presto
http.error.425.description=Il server rifiuta di elaborare una richiesta che potrebbe essere ripetuta.

http.error.426.title=Aggiornamento necessario
http.error.426.description=Il client deve passare a un protocollo diverso per continuare.

http.error.428.title=Requisito necessario
http.error.428.description=Il server richiede che la richiesta sia condizionale.

http.error.429.title=Troppe richieste
http.error.429.description=Troppe richieste in breve tempo. Riprova più tardi.

http.error.431.title=Intestazioni della richiesta troppo grandi
http.error.431.description=Le intestazioni della richiesta sono troppo grandi per essere elaborate dal server.

http.error.451.title=Non disponibile per motivi legali
http.error.451.description=Risorsa non disponibile per motivi legali.

# ---------------------------------------------------------------
# 5xx Server Errors
# ---------------------------------------------------------------
http.error.500.title=Errore interno del server
http.error.500.description=Il server ha riscontrato un errore imprevisto e non è riuscito a completare la richiesta.

http.error.501.title=Non implementato
http.error.501.description=Impossibile completare la richiesta: funzionalità non supportata dal server.

http.error.502.title=Gateway non disponibile
http.error.502.description=Il server ha ricevuto una risposta non valida dal server di origine.

http.error.503.title=Servizio non disponibile
http.error.503.description=Il server non è al momento in grado di gestire la richiesta. Riprova più tardi.

http.error.504.title=Connessione scaduta
http.error.504.description=Il server di origine non ha risposto in tempo.

http.error.505.title=Versione HTTP non supportata
http.error.505.description=La versione HTTP della richiesta non è supportata dal server.

http.error.506.title=Variante negoziabile
http.error.506.description=Errore interno del server nella negoziazione dei contenuti.

http.error.507.title=Spazio insufficiente
http.error.507.description=Impossibile salvare i dati necessari per completare la richiesta.

http.error.508.title=Loop rilevato
http.error.508.description=Il server ha rilevato un ciclo infinito durante l'elaborazione della richiesta.

http.error.510.title=Non esteso
http.error.510.description=Aggiungi estensioni alla richiesta per consentire al server di evaderla.

http.error.511.title=Autenticazione di rete richiesta
http.error.511.description=Autenticati per accedere alla rete.

# ---------------------------------------------------------------
# Generic fallbacks
# ---------------------------------------------------------------
http.error.unknown.title=Errore imprevisto
http.error.unknown.description=Errore imprevisto (codice {0}). Riprova.
