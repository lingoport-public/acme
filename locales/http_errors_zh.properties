# HTTP error status codes (4xx client errors, 5xx server errors)
# Key pattern:
#   http.error.<code>.title       - short reason phrase
#   http.error.<code>.description - user-facing explanation
# Note: values avoid apostrophes so they are safe with java.text.MessageFormat.

# ---------------------------------------------------------------
# 4xx Client Errors
# ---------------------------------------------------------------
http.error.400.title=请求无效
http.error.400.description=服务器无法理解请求：语法无效。

http.error.401.title=未授权
http.error.401.description=请先登录以访问此资源。

http.error.402.title=需付款
http.error.402.description=请先付款，才能处理此请求。

http.error.403.title=权限不足
http.error.403.description=您没有权限访问此资源。

http.error.404.title=未找到
http.error.404.description=找不到该资源。

http.error.405.title=不支持的请求方法
http.error.405.description=该资源不支持此请求方法。

http.error.406.title=不可接受
http.error.406.description=服务器响应格式不符合要求

http.error.407.title=需要代理身份验证
http.error.407.description=必须先通过代理进行身份验证，才能完成此请求。

http.error.408.title=请求超时
http.error.408.description=服务器响应超时，请重试。

http.error.409.title=冲突
http.error.409.description=请求与资源的当前状态冲突。

http.error.410.title=售罄
http.error.410.description=所请求的资源已永久不可用。

http.error.411.title=请输入长度
http.error.411.description=请求必须包含有效的 Content-Length 头部。

http.error.412.title=条件不满足
http.error.412.description=请求头中的一项或多项条件未满足。

http.error.413.title=内容过大
http.error.413.description=请求体超过服务器允许的大小。

http.error.414.title=链接过长
http.error.414.description=请求的 URI 过长，服务器无法处理。

http.error.415.title=不支持的文件类型
http.error.415.description=请求体格式不受支持。

http.error.416.title=请求的范围无法满足
http.error.416.description=此资源无法提供所请求的范围。

http.error.417.title=期望失败
http.error.417.description=服务器无法满足 Expect 请求头的要求。

http.error.418.title=我是茶壶
http.error.418.description=服务器拒绝煮咖啡：它是茶壶。

http.error.421.title=请求目标不正确
http.error.421.description=服务器无法响应该请求。

http.error.422.title=无法处理的内容
http.error.422.description=请求格式正确，但包含语义错误。

http.error.423.title=已锁定
http.error.423.description=您尝试访问的资源已锁定。

http.error.424.title=依赖项失败
http.error.424.description=请求失败：之前依赖的请求失败。

http.error.425.title=时间太早
http.error.425.description=服务器拒绝处理可能被重放的请求。

http.error.426.title=需要升级
http.error.426.description=客户端必须切换到其他协议才能继续。

http.error.428.title=需先满足条件
http.error.428.description=服务器要求此请求为条件请求。

http.error.429.title=请求过于频繁
http.error.429.description=请求过于频繁，请稍后重试。

http.error.431.title=请求头字段过大
http.error.431.description=请求头过大，服务器无法处理。

http.error.451.title=因法律原因不可用
http.error.451.description=该资源因法律原因无法访问。

# ---------------------------------------------------------------
# 5xx Server Errors
# ---------------------------------------------------------------
http.error.500.title=服务器内部错误
http.error.500.description=服务器遇到意外情况，无法完成请求。

http.error.501.title=未实现
http.error.501.description=服务器不支持该请求所需的功能。

http.error.502.title=网关错误
http.error.502.description=上游服务器返回无效响应。

http.error.503.title=服务不可用
http.error.503.description=服务器暂时无法处理请求，请稍后重试。

http.error.504.title=网关超时
http.error.504.description=上游服务器响应超时。

http.error.505.title=不支持的 HTTP 版本
http.error.505.description=服务器不支持请求中使用的 HTTP 版本。

http.error.506.title=该规格也可议价
http.error.506.description=服务器内容协商配置错误。

http.error.507.title=库存不足
http.error.507.description=服务器无法保存请求所需的数据。

http.error.508.title=检测到循环
http.error.508.description=服务器在处理请求时检测到无限循环。

http.error.510.title=未扩展
http.error.510.description=服务器需要更多信息以完成请求。

http.error.511.title=请进行网络认证
http.error.511.description=请验证身份以访问网络。

# ---------------------------------------------------------------
# Generic fallbacks
# ---------------------------------------------------------------
http.error.unknown.title=发生意外错误
http.error.unknown.description=发生意外错误（状态 {0}）。请重试。
