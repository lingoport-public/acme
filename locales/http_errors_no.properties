# HTTP error status codes (4xx client errors, 5xx server errors)
# Key pattern:
#   http.error.<code>.title       - short reason phrase
#   http.error.<code>.description - user-facing explanation
# Note: values avoid apostrophes so they are safe with java.text.MessageFormat.

# ---------------------------------------------------------------
# 4xx Client Errors
# ---------------------------------------------------------------
http.error.400.title=Ugyldig forespørsel
http.error.400.description=Serveren forsto ikke forespørselen på grunn av ugyldig syntaks.

http.error.401.title=Uautorisert
http.error.401.description=Logg inn for å få tilgang.

http.error.402.title=Betaling kreves
http.error.402.description=Betaling kreves før forespørselen kan behandles.

http.error.403.title=Ikke tillatt
http.error.403.description=Du har ikke tilgang til denne ressursen.

http.error.404.title=Ikke funnet
http.error.404.description=Ressursen ble ikke funnet.

http.error.405.title=Metode ikke tillatt
http.error.405.description=Forespørselsmetoden støttes ikke for denne ressursen.

http.error.406.title=Uakseptabelt
http.error.406.description=Serveren kan ikke levere svar i et akseptert format.

http.error.407.title=Proxyautentisering påkrevd
http.error.407.description=Autentiser deg mot proxyen for å fullføre forespørselen.

http.error.408.title=Tidsavbrudd
http.error.408.description=Serveren svarte ikke i tide.

http.error.409.title=Konflikt
http.error.409.description=Forespørselen er i konflikt med ressursens nåværende tilstand.

http.error.410.title=Utsolgt
http.error.410.description=Varen finnes ikke lenger og kommer ikke tilbake.

http.error.411.title=Lengde påkrevd
http.error.411.description=Inkluder en gyldig Content-Length-header.

http.error.412.title=Forutsetning ikke oppfylt
http.error.412.description=En eller flere betingelser i forespørselsheaderne ble ikke oppfylt.

http.error.413.title=Innholdet er for stort
http.error.413.description=Forespørselens innhold er for stort for serveren.

http.error.414.title=URI for lang
http.error.414.description=Den forespurte URI-en er for lang for serveren.

http.error.415.title=Medietypen støttes ikke
http.error.415.description=Forespørselsformatet støttes ikke.

http.error.416.title=Ugyldig område
http.error.416.description=Det forespurte området støttes ikke for denne ressursen.

http.error.417.title=Forventningen ble ikke oppfylt
http.error.417.description=Serveren kan ikke oppfylle kravene i Expect-headeren.

http.error.418.title=Jeg er en tekanne
http.error.418.description=Serveren nekter å brygge kaffe fordi den er en tekanne.

http.error.421.title=Feilsendt forespørsel
http.error.421.description=Forespørselen ble sendt til en server som ikke kan svare.

http.error.422.title=Kan ikke behandle innholdet
http.error.422.description=Forespørselen var riktig formatert, men inneholdt semantiske feil.

http.error.423.title=Låst
http.error.423.description=Ressursen du prøver å åpne er låst.

http.error.424.title=Avhengighet feilet
http.error.424.description=Forespørselen feilet fordi en avhengig forespørsel tidligere feilet.

http.error.425.title=For tidlig
http.error.425.description=Serveren nekter å behandle en forespørsel som kan bli gjentatt.

http.error.426.title=Oppgradering kreves
http.error.426.description=Bytt til en annen protokoll for å fortsette.

http.error.428.title=Forutsetning påkrevd
http.error.428.description=Serveren krever at forespørselen er betinget.

http.error.429.title=For mange forespørsler
http.error.429.description=Du har sendt for mange forespørsler på kort tid. Prøv igjen senere.

http.error.431.title=Overskriftsfeltene i forespørselen er for store
http.error.431.description=Forespørselsheaderne er for store for serveren å behandle.

http.error.451.title=Utilgjengelig av juridiske årsaker
http.error.451.description=Denne ressursen er ikke tilgjengelig av juridiske årsaker.

# ---------------------------------------------------------------
# 5xx Server Errors
# ---------------------------------------------------------------
http.error.500.title=Intern serverfeil
http.error.500.description=Uventet serverfeil: Kunne ikke fullføre forespørselen.

http.error.501.title=Ikke implementert
http.error.501.description=Serveren støtter ikke nødvendig funksjonalitet for å utføre forespørselen.

http.error.502.title=Gateway-feil
http.error.502.description=Serveren mottok et ugyldig svar fra en ekstern server.

http.error.503.title=Tjenesten er ikke tilgjengelig
http.error.503.description=Serveren er midlertidig utilgjengelig. Prøv igjen senere.

http.error.504.title=Gateway-tidsavbrudd
http.error.504.description=Serveren svarte ikke i tide.

http.error.505.title=HTTP-versjon ikke støttet
http.error.505.description=HTTP-versjonen i forespørselen støttes ikke av serveren.

http.error.506.title=Variant kan også forhandles
http.error.506.description=Serveren har en intern konfigurasjonsfeil ved innholdsforhandling.

http.error.507.title=Ikke nok lagringsplass
http.error.507.description=Serveren kan ikke lagre nødvendige data for å fullføre forespørselen.

http.error.508.title=Oppdaget løkke
http.error.508.description=Serveren oppdaget en uendelig løkke under behandling av forespørselen.

http.error.510.title=Ikke utvidet
http.error.510.description=Legg til nødvendige utvidelser for at serveren skal kunne fullføre forespørselen.

http.error.511.title=Nettverksautentisering kreves
http.error.511.description=Logg inn for å få nettverkstilgang.

# ---------------------------------------------------------------
# Generic fallbacks
# ---------------------------------------------------------------
http.error.unknown.title=Uventet feil
http.error.unknown.description=Uventet feil (status {0}). Prøv igjen.
