# HTTP error status codes (4xx client errors, 5xx server errors)
# Key pattern:
#   http.error.<code>.title       - short reason phrase
#   http.error.<code>.description - user-facing explanation
# Note: values avoid apostrophes so they are safe with java.text.MessageFormat.

# ---------------------------------------------------------------
# 4xx Client Errors
# ---------------------------------------------------------------
http.error.400.title=Ungültige Anfrage
http.error.400.description=Die Anfrage kann wegen fehlerhafter Syntax nicht verarbeitet werden.

http.error.401.title=Nicht autorisiert
http.error.401.description=Bitte anmelden, um auf diese Ressource zuzugreifen.

http.error.402.title=Zahlung erforderlich
http.error.402.description=Zahlung erforderlich, um diese Anfrage zu bearbeiten.

http.error.403.title=Verboten
http.error.403.description=Sie haben keine Zugriffsberechtigung für diese Ressource.

http.error.404.title=Nicht gefunden
http.error.404.description=Die angeforderte Ressource wurde nicht gefunden.

http.error.405.title=Aktion nicht erlaubt
http.error.405.description=Die Anfragemethode wird für diese Ressource nicht unterstützt.

http.error.406.title=Nicht zulässig
http.error.406.description=Der Server kann keine Antwort im akzeptierten Format liefern.

http.error.407.title=Proxy-Authentifizierung erforderlich
http.error.407.description=Bitte beim Proxy anmelden, um fortzufahren.

http.error.408.title=Anfrage‑Zeitüberschreitung
http.error.408.description=Server nicht erreichbar.

http.error.409.title=Konflikt
http.error.409.description=Die Anfrage widerspricht dem aktuellen Zustand der Ressource.

http.error.410.title=Ausverkauft
http.error.410.description=Die angeforderte Ressource ist dauerhaft nicht verfügbar.

http.error.411.title=Länge erforderlich
http.error.411.description=Bitte gültigen 'Content-Length'-Header angeben.

http.error.412.title=Bedingung nicht erfüllt
http.error.412.description=Eine oder mehrere Bedingungen in den Anfrage-Headern wurden nicht erfüllt.

http.error.413.title=Inhalt zu groß
http.error.413.description=Der Anfrageinhalt ist zu groß für den Server.

http.error.414.title=URI zu lang
http.error.414.description=Die angeforderte URI ist zu lang für den Server.

http.error.415.title=Dateiformat nicht unterstützt
http.error.415.description=Das Format des Anfragekörpers wird nicht unterstützt.

http.error.416.title=Angeforderter Bereich nicht verfügbar
http.error.416.description=Der angeforderte Bereich ist für diesen Artikel nicht verfügbar.

http.error.417.title=Erwartung nicht erfüllt
http.error.417.description=Der Server kann die Anforderungen des Expect-Headers nicht erfüllen.

http.error.418.title=Ich bin eine Teekanne
http.error.418.description=Der Server verweigert das Kaffeebrühen — er ist eine Teekanne.

http.error.421.title=Fehlgeleitete Anfrage
http.error.421.description=Anfrage an einen Server gesendet, der nicht antworten kann.

http.error.422.title=Inhalt nicht verarbeitbar
http.error.422.description=Die Anfrage ist korrekt, enthält jedoch semantische Fehler.

http.error.423.title=Gesperrt
http.error.423.description=Die angeforderte Ressource ist gesperrt.

http.error.424.title=Abhängigkeit nicht erfüllt
http.error.424.description=Anfrage fehlgeschlagen: Eine vorherige, davon abhängige Anfrage schlug fehl.

http.error.425.title=Zu früh
http.error.425.description=Anfrage abgelehnt — mögliche Wiederholung. Bitte erneut senden.

http.error.426.title=Upgrade erforderlich
http.error.426.description=Wechseln Sie zu einem anderen Protokoll, um fortzufahren.

http.error.428.title=Voraussetzung erforderlich
http.error.428.description=Bedingte Anfrage erforderlich.

http.error.429.title=Zu viele Anfragen
http.error.429.description=Sie haben zu viele Anfragen in kurzer Zeit gesendet. Bitte versuchen Sie es später erneut.

http.error.431.title=Anfrage-Header zu groß
http.error.431.description=Die Anfrage-Header sind zu groß, um vom Server verarbeitet zu werden.

http.error.451.title=Aus rechtlichen Gründen nicht verfügbar
http.error.451.description=Diese Ressource ist aus rechtlichen Gründen nicht verfügbar.

# ---------------------------------------------------------------
# 5xx Server Errors
# ---------------------------------------------------------------
http.error.500.title=Interner Serverfehler
http.error.500.description=Serverfehler: Die Anfrage konnte nicht abgeschlossen werden.

http.error.501.title=Nicht verfügbar
http.error.501.description=Der Server unterstützt die für die Anfrage erforderliche Funktion nicht.

http.error.502.title=Gateway-Fehler
http.error.502.description=Ungültige Antwort von einem vorgelagerten Server.

http.error.503.title=Service nicht verfügbar
http.error.503.description=Der Server ist vorübergehend nicht erreichbar. Bitte versuchen Sie es später erneut.

http.error.504.title=Gateway-Zeitüberschreitung
http.error.504.description=Der externe Server hat nicht rechtzeitig geantwortet.

http.error.505.title=HTTP-Version nicht unterstützt
http.error.505.description=Die verwendete HTTP-Version wird vom Server nicht unterstützt.

http.error.506.title=Variante ebenfalls verhandelbar
http.error.506.description=Interner Server‑Konfigurationsfehler bei der Inhaltsverhandlung.

http.error.507.title=Nicht genügend Speicherplatz
http.error.507.description=Der Server kann die benötigten Daten nicht speichern.

http.error.508.title=Schleife erkannt
http.error.508.description=Der Server hat während der Verarbeitung der Anfrage eine Endlosschleife festgestellt.

http.error.510.title=Nicht verlängert
http.error.510.description=Bitte ergänzen Sie die Anfrage, damit der Server sie erfüllen kann.

http.error.511.title=Netzwerk-Authentifizierung erforderlich
http.error.511.description=Anmelden, um Netzwerk zu nutzen.

# ---------------------------------------------------------------
# Generic fallbacks
# ---------------------------------------------------------------
http.error.unknown.title=Unerwarteter Fehler
http.error.unknown.description=Unerwarteter Fehler (Status {0}). Bitte versuchen Sie es erneut.
